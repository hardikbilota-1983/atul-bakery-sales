# Atul Bakery Sales Analytics — Render Blueprint
# Free Node web service (needed for Clover API proxy; static sites can't hold secrets)

services:
  - type: web
    name: atul-bakery-sales
    runtime: node
    plan: free
    rootDir: dashboard
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLOVER_BASE_URL
        value: https://api.clover.com
      - key: CLOVER_STORE_NAME
        value: Hillside
      - key: CLOVER_MERCHANT_ID
        sync: false
      - key: CLOVER_API_TOKEN
        sync: false
