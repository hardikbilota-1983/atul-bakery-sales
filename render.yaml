# Atul Bakery Sales Analytics — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# Deploy: connect this repo in Render → New → Blueprint
# Free Static Site (sleeps only for web services; static stays online)

services:
  - type: web
    name: atul-bakery-sales
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback — existing files under /data and /assets are still served
      - type: rewrite
        source: /*
        destination: /index.html
