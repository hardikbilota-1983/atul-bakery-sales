# Atul Bakery Sales Analytics — Render Blueprint
# Free Node web service (Clover API needs a server — not a static site)

services:
  - type: web
    name: atul-bakery-sales
    runtime: node
    plan: free
    rootDir: dashboard
    # Install devDependencies so `tsc` / `vite` are available during build
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: CLOVER_BASE_URL
        value: https://api.clover.com
      - key: CLOVER_STORE_NAME
        value: Hillside
      - key: CLOVER_TIMEZONE
        value: America/New_York
      - key: CLOVER_MERCHANT_ID
        sync: false
      - key: CLOVER_API_TOKEN
        sync: false
      - key: REPORT_ENABLED
        value: "false"
      - key: CRON_SECRET
        sync: false
      - key: GMAIL_USER
        value: atulbakeryhillside@gmail.com
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: REPORT_FROM
        value: atulbakeryhillside@gmail.com
      - key: REPORT_TO
        sync: false
      - key: REPORT_CATEGORIES
        sync: false
