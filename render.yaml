# Atul Bakery Sales Analytics — Render Blueprint
# Free Node web service (Clover API needs a server — not a static site)

services:
  - type: web
    name: atul-bakery-sales
    runtime: node
    plan: free
    rootDir: dashboard
    # Install devDependencies so `tsc` / `vite` are available during build
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: CLOVER_BASE_URL
        value: https://api.clover.com
      - key: CLOVER_STORE_NAME
        value: Hillside
      - key: CLOVER_MERCHANT_ID
        sync: false
      - key: CLOVER_API_TOKEN
        sync: false
